name: Verify Game & Headless Contract

on:
  push:
    branches: ["main"]
    tags: ["phase-*", "v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full verification suite
        run: python3 scripts/verify.py
